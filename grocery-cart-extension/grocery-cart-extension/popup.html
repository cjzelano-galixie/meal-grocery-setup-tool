<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Same palette as the meal planner page: green primary, blue
         secondary, light gray background, white cards. */
      body {
        width: 340px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f4f6f8;
        color: #333;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px 0;
        color: #2c3e50;
      }
      h2 {
        font-size: 12px;
        margin: 16px 0 6px 0;
        color: #2c3e50;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      button {
        background: #27ae60;
        color: white;
        border: none;
        padding: 10px 14px;
        font-size: 13px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        margin-bottom: 6px;
      }
      button:hover {
        background: #219653;
      }
      button.secondary {
        background: #2980b9;
      }
      button.secondary:hover {
        background: #21618c;
      }
      button:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
      }
      #status,
      #cartStatus {
        font-size: 12px;
        margin-top: 4px;
        min-height: 16px;
        font-weight: bold;
        line-height: 1.4;
      }
      #itemList {
        max-height: 180px;
        overflow-y: auto;
        border: 1px solid #ecf0f1;
        border-radius: 4px;
        padding: 8px;
        margin: 8px 0;
        background: white;
        font-size: 12px;
      }
      .item-row {
        padding: 4px 0;
        border-bottom: 1px solid #f4f6f8;
      }
      .item-row:last-child {
        border-bottom: none;
      }
      .dept-tag {
        color: #7f8c8d;
        font-size: 11px;
      }
      .empty-hint {
        color: #95a5a6;
        font-style: italic;
      }
      footer {
        font-size: 11px;
        color: #95a5a6;
        margin-top: 14px;
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>🛒 Grocery Cart Filler</h1>

    <h2>Step 1 · Load list</h2>
    <button id="btnLoad">Load Grocery List From This Tab</button>
    <div id="status"></div>
    <div id="itemList"></div>

    <h2>Step 2 · Fill cart</h2>
    <button id="btnFill" class="secondary" disabled>
      Start Adding to Cart on This Tab
    </button>
    <div id="cartStatus"></div>

    <footer>
      Open your meal planner tab for Step 1. Then go to your ALDI pickup
      order page and click Step 2.
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
